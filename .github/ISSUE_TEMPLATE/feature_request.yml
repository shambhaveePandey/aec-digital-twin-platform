name: Feature Request
description: Propose a new feature or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered and why you prefer this one.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Viewer / 3D engine
        - IFC loading / Fragments
        - API / backend
        - Database / schema
        - Sensor integration
        - Auth / workspaces
        - CI / infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
