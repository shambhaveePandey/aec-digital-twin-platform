name: Sensor Integration Request
description: Request support for a new sensor protocol, device type, or MQTT topic schema.
title: "sensor: "
labels: ["sensor-integration", "enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What sensor or protocol do you want to integrate?
      description: Name the device, protocol (MQTT, HTTP, WebSocket, OPC-UA…), and payload format.
    validations:
      required: true

  - type: textarea
    id: payload
    attributes:
      label: Example payload
      description: Paste a representative JSON or binary payload sample.
      render: json

  - type: textarea
    id: ifc_binding
    attributes:
      label: IFC element binding
      description: How should sensor readings map to model elements? (GUID, element ID, zone, etc.)

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What insight or alert should this integration enable?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
